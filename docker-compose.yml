services:
  liventi.api:
    image: ${DOCKER_REGISTRY-}liventiapi
    container_name: Liventi.Api
    build:
      context: .
      dockerfile: src/Liventi.Api/Dockerfile
    depends_on:
      - liventi-db

  liventi-db:
    image: postgres:latest
    container_name: Liventi.Db
    environment:
      - POSTGRES_DB=liventi
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./.containers/database:/var/lib/postgresql
    ports:
      - "5432:5432"

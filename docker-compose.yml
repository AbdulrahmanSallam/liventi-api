services:
  liventi.api:
    image: ${DOCKER_REGISTRY-}liventiapi
    container_name: Liventi.Api
    build:
      context: .
      dockerfile: src/Liventi.Api/Dockerfile
    depends_on:
      - liventi-db

  liventi-db:
    image: postgres:latest
    container_name: Liventi.Db
    environment:
      - POSTGRES_DB=liventi
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./.containers/database:/var/lib/postgresql
    ports:
      - "5432:5432"

  liventi-idp:
    image: quay.io/keycloak/keycloak:latest
    container_name: Liventi.Identity
    command: start-dev --import-realm
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    volumes:
      - ./.containers/identity:/opt/keycloak/data
      - ./.files/liventi-realm-export.json:/opt/keycloak/data/import/realm.json
    ports:
      - 18080:8080
